name: Release

on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changes.outputs.plugins }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Detect changed plugins
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep 'plugins/.*/\.claude-plugin/plugin\.json' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "plugins=$CHANGED" >> $GITHUB_OUTPUT

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: ${{ fromJson(needs.detect-changes.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v5
      - name: Get plugin version
        id: version
        run: |
          VERSION=$(jq -r '.version' plugins/${{ matrix.plugin }}/.claude-plugin/plugin.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check if release exists
        id: check
        run: |
          if gh release view "${{ matrix.plugin }}-v${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.plugin }}-v${{ steps.version.outputs.version }}
          name: "${{ matrix.plugin }} v${{ steps.version.outputs.version }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
