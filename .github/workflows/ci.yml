name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './plugins'

  bats-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bats
        uses: bats-core/bats-action@3.0.1
      - name: Run tests
        run: bats plugins/obsidian-skills/tests/

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON files
        run: |
          find . -name "*.json" -exec sh -c 'echo "Validating {}"; python3 -m json.tool {} > /dev/null' \;
